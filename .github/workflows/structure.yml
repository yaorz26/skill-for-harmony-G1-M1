name: Structure checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/check-structure.mjs
      - run: node tools/check-core.mjs
